name: Deploy Production → Hostinger

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'apps/web/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'deploy/deploy-postbuild.js'
      - 'deploy/health-check.mjs'
      - 'deploy/hostinger-deploy.mjs'
      - 'deploy/stage-zip.sh'
      - '.github/workflows/deploy-production.yml'
  workflow_dispatch:
    inputs:
      target:
        description: Serviço a publicar (Web implica republicar a API)
        required: true
        default: all
        type: choice
        options:
          - all
          - api

permissions:
  contents: read

# A Hostinger recusa uploads durante outro build na mesma conta. Uma fila única
# também impede que um deploy antigo termine depois de uma versão mais recente.
concurrency:
  group: hostinger-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate, package and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 50
    # Mantém compatibilidade com os secrets que já existem neste environment.
    environment: HOSTINGER_API_TOKEN

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Determinar o alcance do deploy
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_TARGET: ${{ inputs.target }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          deploy_api=false
          deploy_web=false

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            deploy_api=true
            [ "$REQUESTED_TARGET" = "all" ] && deploy_web=true
          else
            if [ -n "$BEFORE_SHA" ] && ! printf '%s' "$BEFORE_SHA" | grep -Eq '^0+$'; then
              changed_files="$(git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA")"
            else
              changed_files="$(git show --pretty='' --name-only "$CURRENT_SHA")"
            fi

            printf '%s\n' "$changed_files"
            if printf '%s\n' "$changed_files" | grep -Eq '^(apps/web/|package.json$|pnpm-lock.yaml$|pnpm-workspace.yaml$|deploy/|\.github/workflows/deploy-production.yml$)'; then
              deploy_web=true
              deploy_api=true
            elif printf '%s\n' "$changed_files" | grep -Eq '^apps/api/'; then
              deploy_api=true
            fi
          fi

          echo "deploy_api=$deploy_api" >> "$GITHUB_OUTPUT"
          echo "deploy_web=$deploy_web" >> "$GITHUB_OUTPUT"
          echo "API: $deploy_api | Web: $deploy_web"

      - name: Verificar secrets
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
          API_ENV_PRODUCTION: ${{ secrets.API_ENV_PRODUCTION }}
        run: |
          [ -n "$HOSTINGER_API_TOKEN" ] || { echo "::error::Secret HOSTINGER_API_TOKEN em falta"; exit 1; }
          [ -n "$API_ENV_PRODUCTION" ] || { echo "::error::Secret API_ENV_PRODUCTION em falta"; exit 1; }

      - name: Instalar dependências no GitHub
        run: pnpm install --frozen-lockfile

      - name: Gerar cliente Prisma
        run: pnpm --filter api exec prisma generate

      - name: Validar API
        if: steps.scope.outputs.deploy_api == 'true'
        run: |
          pnpm --filter api exec eslint "{src,apps,libs,test}/**/*.ts"
          pnpm --filter api exec jest --runInBand
          pnpm --filter api exec jest --config ./test/jest-e2e.json --runInBand

      - name: Validar Web
        if: steps.scope.outputs.deploy_web == 'true'
        run: pnpm --filter web lint

      # O pacote Web é montado primeiro, mas nenhum serviço é alterado enquanto
      # os dois ZIPs não estiverem prontos e validados no runner.
      - name: Montar Web pré-compilada
        if: steps.scope.outputs.deploy_web == 'true'
        env:
          NEXT_PUBLIC_API_URL: https://api.lumactraspots.com/api/v1
        run: bash deploy/stage-zip.sh web "$RUNNER_TEMP/web.zip"

      - name: Montar API pré-compilada
        if: steps.scope.outputs.deploy_api == 'true'
        env:
          API_ENV_PRODUCTION: ${{ secrets.API_ENV_PRODUCTION }}
        run: bash deploy/stage-zip.sh api "$RUNNER_TEMP/api.zip"

      - name: Validar pacotes de runtime
        run: |
          if [ "${{ steps.scope.outputs.deploy_web }}" = "true" ]; then
            unzip -t "$RUNNER_TEMP/web.zip"
          fi
          unzip -t "$RUNNER_TEMP/api.zip"
          unzip -l "$RUNNER_TEMP/api.zip" | grep -q 'dist/src/main.js'
          if unzip -l "$RUNNER_TEMP/api.zip" | grep -q 'src/main.ts'; then
            echo "::error::O ZIP da API contém source TypeScript"
            exit 1
          fi

      - name: Publicar Web
        if: steps.scope.outputs.deploy_web == 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node deploy/hostinger-deploy.mjs lumactraspots.com "$RUNNER_TEMP/web.zip"

      # Sempre termina com a API: o deploy Web da conta atual limpa a pasta
      # Node partilhada onde a API também está instalada.
      - name: Publicar API
        if: steps.scope.outputs.deploy_api == 'true'
        env:
          HOSTINGER_API_TOKEN: ${{ secrets.HOSTINGER_API_TOKEN }}
        run: node deploy/hostinger-deploy.mjs api.lumactraspots.com "$RUNNER_TEMP/api.zip"

      - name: Confirmar saúde em produção
        run: node deploy/health-check.mjs
